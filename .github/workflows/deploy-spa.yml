name: Deploy SPA

on:
  push:
    branches: [main, master]
    paths:
      - 'spa/**'
      - '.github/workflows/deploy-spa.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spa

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Bunny Storage
        uses: ayeressian/bunnycdn-storage-deploy@v2.4.3
        with:
          source: "spa/dist"
          storageZoneName: "${{ secrets.BUNNY_SPA_STORAGE_USERNAME }}"
          storagePassword: "${{ secrets.BUNNY_SPA_STORAGE_PASSWORD }}"
          accessKey: "${{ secrets.BUNNY_API_KEY }}"
          storageEndpoint: "${{ secrets.BUNNY_SPA_STORAGE_HOSTNAME }}"
          upload: "true"
          remove: "true"
