name: Deploy SPA

on:
  push:
    branches: [main, master]
    paths:
      - 'spa/**'
      - '.github/workflows/deploy-spa.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spa

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Bunny Storage
        env:
          BUNNY_SPA_STORAGE_PASSWORD: ${{ secrets.BUNNY_SPA_STORAGE_PASSWORD }}
          BUNNY_SPA_STORAGE_HOSTNAME: ${{ secrets.BUNNY_SPA_STORAGE_HOSTNAME }}
          BUNNY_SPA_STORAGE_USERNAME: ${{ secrets.BUNNY_SPA_STORAGE_USERNAME }}
        run: |
          BASE_URL="https://${BUNNY_SPA_STORAGE_HOSTNAME}/${BUNNY_SPA_STORAGE_USERNAME}"
          echo "BASE_URL: https://${BUNNY_SPA_STORAGE_HOSTNAME}/***"

          find dist -type f | while read -r file; do
            path="${file#dist/}"
            mime=$(file --brief --mime-type "$file")
            echo "Uploading $path ($mime)"
            HTTP_CODE=$(curl -s --retry 3 -o /dev/null -w "%{http_code}" \
              -X PUT "${BASE_URL}/${path}" \
              -H "AccessKey: ${BUNNY_SPA_STORAGE_PASSWORD}" \
              -H "Content-Type: ${mime}" \
              --data-binary "@${file}")
            echo "  -> HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "Upload failed with HTTP $HTTP_CODE"
              exit 1
            fi
          done

          echo "SPA deployed successfully"
