---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
      - apt-listchanges
      - curl
      - gnupg
    state: present

- name: Configure UFW defaults
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow HTTPS (Caddy)
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Allow HTTP (Caddy ACME challenges)
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow LND P2P
  community.general.ufw:
    rule: allow
    port: "9735"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Enable fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

- name: Enable unattended-upgrades
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started
