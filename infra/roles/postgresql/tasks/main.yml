---
- name: Install PostgreSQL
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present

- name: Ensure PostgreSQL is running
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started

- name: Create mint database user
  community.postgresql.postgresql_user:
    name: "{{ mint_db_user }}"
    password: "{{ vault_mint_db_password }}"
    state: present
  become_user: postgres
  no_log: true

- name: Create mint database
  community.postgresql.postgresql_db:
    name: "{{ mint_db_name }}"
    owner: "{{ mint_db_user }}"
    state: present
  become_user: postgres
